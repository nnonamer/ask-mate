<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Ask Mate</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand fw-bold" href="/">AskMate</a>
				<div class="d-flex mx-auto col-4 my-2" role="search">
					<input class="form-control me-2" type="search" placeholder="Search questions..." aria-label="Search"/>
					<button class="btn btn-outline-success" id="searchBtn">Search</button>
				</div>
				<div class="d-flex gap-2 align-items-center col-auto">
					<a class="btn btn-primary" href="/login">Log in</a>
					<a class="btn btn-outline-primary" href="/register">Register</a>
					<button id="logout-button" class="btn btn-danger" type="button">Log out</button>
				</div>
		</div>
	</nav>
<!--	<section class="" id="add-question">-->
<!--	</section>-->
	<div id="questions" class="d-flex justify-content-center mx-auto w-75 gap-4 flex-wrap mt-3"></div>

	<script th:src="@{/js/addNewQuestionForm.js}"></script>
	<script th:src="@{/js/questions.js}"></script>
	<script th:src="@{/js/logout.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
